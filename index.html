<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>rf_studiodigital</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: #fff;
      background-color: #0a0a0a;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ===== MENÚ NUEVO ===== */
    .menu-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #ffffff;
      cursor: pointer;
      z-index: 1000;
    }

    .menu-links {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 3.5rem;
      right: 1rem;
      background-color: #111;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .menu-links.show {
      display: flex;
    }

    .menu-links a {
      color: #ebebeb;
      text-decoration: none;
      padding: 1rem;
      display: block;
      border-bottom: 1px solid #333;
      transition: background 0.3s, color 0.3s;
    }

    .menu-links a:hover,
    .menu-links a.active {
      background-color: #00ffcc;
      color: #111;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.4);
      z-index: -1;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      animation: fadeIn 2s ease;
    }

    .hero-content .logo {
      width: 200px;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 25px rgba(0,200,255,0.6);
      border-radius: 10px;
    }

    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      color: #00c8ff;
    }

    .hero-content p {
      font-size: 1.3rem;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background: #00c8ff;
      color: #000;
      padding: 0.8rem 2rem;
      border-radius: 30px;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #fff;
      color: #00c8ff;
      box-shadow: 0 0 15px #00c8ff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -40%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* ===== FOOTER ===== */
    .footer-wrapper {
      background: #0b0b0b;
      padding: 2rem 1rem;
      text-align: center;
    }

    .footer {
      max-width: 900px;
      margin: 0 auto;
    }

    .footer p {
      font-size: 1rem;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-links a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.05);
      padding: 0.6rem 1rem;
      border-radius: 30px;
      transition: background 0.3s ease, transform 0.2s;
    }

    .footer-links a:hover {
      background: rgba(0,200,255,0.2);
      transform: scale(1.05);
    }

    .footer-links img {
      filter: invert(100%);
    }

    /* ===== BOTÓN VOLVER ARRIBA ===== */
    .float-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #00c8ff;
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      box-shadow: 0 0 10px #00c8ff;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .float-btn:hover {
      background: #fff;
      color: #00c8ff;
      transform: translateY(-5px);
    }

  </style>
</head>

<body>
  <!-- Menú -->
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
  <div class="menu-links" id="menuLinks">
    <a href="index.html">Inicio</a>
    <a href="descripcion.html">Descripción</a>
    <a href="habilidades.html">Habilidades</a>
    <a href="proyectos.html">Proyectos</a>
  </div>

  <!-- Hero -->
  <section class="video-fondo hero">
    <video class="bg-video" autoplay muted loop>
      <source src="assets/video/fondo.index.mp4" type="video/mp4">
    </video>
    <div class="hero-content">
      <img src="assets/img/logorf_studiodigital.jpg" alt="Logo rf_studiodigital" class="logo">
      <h1>rf_studiodigital</h1>
      <p>¡Bienvenidos!</p>
      <a href="descripcion.html" class="btn">Conócenos</a>
    </div>
  </section>

  <!-- Footer -->
  <div class="footer-wrapper">
    <footer class="footer">
      <p>&copy; 2025 rf_studiodigital <br><br> ¡Contáctanos y llevemos tu proyecto al siguiente nivel!</p>
      <div class="footer-links">
        <a href="https://wa.me/092870198" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/24/733/733585.png" alt="WhatsApp">
          <span>092 870 198</span>
        </a>
        <a href="https://www.instagram.com/rf_studiodigital" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/24/2111/2111463.png" alt="Instagram">
          <span>@rf_studiodigital</span>
        </a>
        <a href="https://www.facebook.com/rfstudiodigital" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/24/733/733547.png" alt="Facebook">
          <span>rfstudiodigital</span>
        </a>
        <a href="https://www.tiktok.com/@rf_studiodigital" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/24/3046/3046122.png" alt="TikTok">
          <span>@rf_studiodigital</span>
        </a>
      </div>
    </footer>
  </div>

  <!-- Botón flotante -->
  <a href="#" class="float-btn to-top" title="Volver arriba">⬆</a>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("menuToggle");
    const menu = document.getElementById("menuLinks");

    toggle.addEventListener("click", function () {
      menu.classList.toggle("show");
    });

    const currentPage = window.location.pathname.split("/").pop();
    const links = document.querySelectorAll(".menu-links a");
    links.forEach(link => {
      if (link.getAttribute("href") === currentPage) {
        link.classList.add("active");
      }
    });
  });
  </script>

</body>
</html>
